<head>

<style>
:root{--p:#1e3a5f;--p2:#2c5282;--ok:#1f8a5b;--bad:#c0392b;--bg:#f3f5f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e6ee;--gold:#b8860b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav{width:230px;background:var(--p);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:18px;margin:4px 10px 14px;display:flex;gap:8px;align-items:center}
nav button{background:none;border:0;color:#cfdcf0;text-align:right;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:center}
nav button.on,nav button:hover{background:rgba(255,255,255,.14);color:#fff}
main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%;padding-bottom:90px}
h2{margin:0 0 14px;font-size:22px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.stat small{color:var(--mu);display:block;margin-bottom:6px}
.stat b{font-size:24px}
.in{color:var(--ok)}.out{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.g{background:#fff;color:var(--p);border:1px solid var(--bd)}
.btn.in2{background:var(--ok)}.btn.out2{background:var(--bad)}
.btn.s{padding:5px 10px;font-size:13px}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);font-size:14px}
th{background:#f0f3f8;color:var(--mu);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#e8eef7;color:var(--p)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.on{display:flex}
.box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.bar{height:10px;border-radius:6px;background:#e6ebf3;overflow:hidden}.bar i{display:block;height:100%;background:var(--p2)}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu)}
.chart span{display:flex;gap:2px;align-items:flex-end;height:130px;width:100%;justify-content:center}
.chart i{width:42%;border-radius:4px 4px 0 0;min-height:2px}
.tabs{display:none}
.fab{position:fixed;bottom:76px;left:16px;z-index:20;display:none}
@media(max-width:800px){
 nav{display:none}
 .tabs{display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--p);z-index:30;padding:4px 2px env(safe-area-inset-bottom)}
 .tabs button{flex:1;background:none;border:0;color:#cfdcf0;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
 .tabs button.on{color:#fff;font-weight:700}.tabs button span{font-size:19px}
 main{padding:14px 12px 100px}
 .fab{display:block}
 th,td{padding:8px 8px;font-size:13px}
 .grid{grid-template-columns:1fr 1fr}.stat b{font-size:19px}
}
@media print{nav,.tabs,.fab,.noprint{display:none!important}main{max-width:none;padding:0}body{background:#fff}}
#lock{position:fixed;inset:0;background:var(--p);z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff}
.lbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;padding:20px;text-align:center}
.lbox input{text-align:left;font-size:16px;color:#1b2430}.lbtn{background:#fff!important;color:#1e3a5f!important;font-weight:700}
.lbox a{color:#cfdcf0;font-size:14px}.lmsg{min-height:20px;font-size:14px;color:#ffd7d2}
#lform{display:flex;flex-direction:column;gap:12px}
body.ro .fab,body.ro .wr{display:none!important}

/* ---- polish ---- */
:root{--p:#1b365d;--p2:#2c5282;--gold:#c9a227;--bg:#f4f1ea;--bd:#e6e1d6;--sh:0 2px 10px rgba(27,54,93,.07)}
body{font-family:"Cairo","Tajawal","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg) radial-gradient(1200px 400px at 100% -10%,rgba(201,162,39,.10),transparent 60%);line-height:1.6}
nav{background:linear-gradient(180deg,#1b365d 0%,#13294a 100%);box-shadow:-2px 0 14px rgba(0,0,0,.12)}
nav h1{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid rgba(201,162,39,.45)}
nav button{transition:background .2s,color .2s,transform .15s;border-right:3px solid transparent}
nav button:hover{transform:translateX(-2px)}
nav button.on{background:rgba(255,255,255,.12);border-right-color:var(--gold)}
h2{font-weight:700;color:var(--p);letter-spacing:.2px}
h3{color:var(--p);font-weight:700}
.card{border-radius:16px;box-shadow:var(--sh);transition:box-shadow .25s,transform .25s}
.stat{position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,54,93,.12)}
.btn{border-radius:12px;font-weight:600;box-shadow:0 1px 3px rgba(27,54,93,.18);transition:transform .12s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(27,54,93,.22)}
.btn:active{transform:scale(.97)}
.btn.g{box-shadow:none}
input,select,textarea{border-radius:12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.2)}
th{background:#f1ede2;color:var(--p)}
tr{transition:background .15s}tbody tr:hover td,table tr:hover td{background:#faf8f2}
.tw{border-radius:14px;box-shadow:var(--sh)}
.tag{background:#efe7cf;color:#6b5410}
.bar{height:9px}.bar i{background:linear-gradient(90deg,var(--p2),#4a78b5)}
.modal{backdrop-filter:blur(3px)}.modal.on .box{animation:pop .22s ease}
.box{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>*{animation:fade .35s ease both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
#lock{background:radial-gradient(900px 500px at 50% 0%,#2f5a93 0%,transparent 70%),linear-gradient(160deg,#1b365d,#0f2240)}
#lock:before{content:"\271D";position:absolute;font-size:520px;color:rgba(201,162,39,.07);line-height:1;pointer-events:none;top:50%;left:50%;transform:translate(-50%,-52%)}
.lbox{position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:24px;backdrop-filter:blur(8px);padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .5s ease}
.lbox h1{margin:4px 0 8px;font-size:26px}
#llogo:empty:before{content:"\26EA";font-size:54px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.lbtn{background:linear-gradient(180deg,#e6c24f,#c9a227)!important;color:#1b2a45!important;border-radius:12px}
#foot,#lfoot{text-align:center;color:var(--mu);font-size:13px;padding:22px 10px 6px;margin-top:26px;position:relative}
#foot:before,#lfoot:before{content:"\2726";display:block;color:var(--gold);font-size:14px;margin-bottom:6px;letter-spacing:6px}
#lfoot{color:#cfdcf0;position:absolute;bottom:18px;left:0;right:0;margin:0}
.tabs{background:linear-gradient(180deg,#1b365d,#13294a);box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.tabs button{transition:color .2s,transform .15s;position:relative}
.tabs button.on:before{content:"";position:absolute;top:-4px;width:26px;height:3px;border-radius:3px;background:var(--gold)}
@media(max-width:800px){main>*{animation-duration:.25s}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#foot:before{display:none}}
</style>
</head>
<body>
<div id="lock"><div class="lbox"><div id="llogo"></div><h1 id="lname">⛪ حسابات الكنيسة</h1><div id="lmsg" class="lmsg"></div><div id="lform"><input id="un" placeholder="اسم المستخدم" style="display:none"><input id="em" type="email" inputmode="email" autocomplete="username" placeholder="البريد الإلكتروني" dir="ltr"><input id="pw" type="password" autocomplete="current-password" placeholder="كلمة المرور" dir="ltr"><button class="btn lbtn" id="lgo" onclick="doAuth()">دخول</button><a href="#" id="lsw" onclick="swAuth();return false">مستخدم جديد؟ إنشاء حساب</a></div></div></div><div id="lfoot">الأب شربل</div></div>

<script>
const SB=supabase.createClient('https://eeaalajfycetfjccfute.supabase.co','sb_publishable_CYTXG2LLcWkEbcj4rf7ECw_3ftETaOq');
const LOGOH=l=>l?'<img src="'+l+'" style="width:34px;height:34px;border-radius:8px;object-fit:cover">':'⛪';
function cacheBrand(){try{localStorage.setItem('brand',JSON.stringify({c:D.church,l:D.logo||'',f:D.footer||''}))}catch(e){}}
function loginBrand(){{const lf=$('#lfoot'),lk=$('#lock');if(lf&&lk&&lf.parentElement!==lk)lk.appendChild(lf)}try{const b=JSON.parse(localStorage.getItem('brand')||'null');if(b){$('#lname').textContent=b.c;$('#lfoot').textContent=b.f!=null?b.f:'الأب شربل';if(b.l)$('#llogo').innerHTML='<img src="'+b.l+'" style="width:84px;height:84px;border-radius:18px;object-fit:cover">'}}catch(e){}}
const UNAME=()=>(ME&&ME.user_metadata&&ME.user_metadata.name)||'';
function resizeImg(f,max,cb,q){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q||.85))};i.src=r.result};r.readAsDataURL(f)}
function setLogo(f){if(f)resizeImg(f,256,d=>{D.logo=d;save();cacheBrand();set()})}

let ME=null,ROLE='none',authMode='in';
const CANW=()=>ROLE==='admin'||ROLE==='treasurer';

const lc=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>lc(new Date());
const DEF={church:'الكنيسة',cur:'ج.م',pin:'',
 wallets:[{id:'w1',name:'الخزنة',open:0},{id:'w2',name:'البنك',open:0},{id:'w3',name:'فودافون كاش',open:0}],
 cats:{in:['عشور','تقدمات','تبرعات','اشتراكات','نذور','كشافة وخدمات','إيرادات أخرى'],out:['مرتبات','كهرباء ومياه','صيانة','مساعدات اجتماعية','اشتراكات','خدمات ورحلات','مصروفات إدارية','مصروفات أخرى']},
 people:[],tx:[],budget:{},funds:[],lockedUntil:'',lowCash:0,subGrace:7,pledges:[],rec:[],recSkip:[],footer:'الأب شربل'};
let D=JSON.parse(JSON.stringify(DEF));let view='home';let flt={m:today().slice(0,7),q:'',t:'',c:''};
let saveT=null;
function save(){if(!CANW())return;clearTimeout(saveT);saveT=setTimeout(pushSettings,400)}
async function pushSettings(){const {church,cur,wallets,cats,people,budget,logo,m1,subs,subAmt,subCustom,funds,lockedUntil,lowCash,subGrace,m2,subW,pledges,rec,recSkip,footer}=D;const {error}=await SB.from('settings').upsert({id:1,data:{church,cur,wallets,cats,people,budget,logo,m1,subs,subAmt,subCustom,funds,lockedUntil,lowCash,subGrace,m2,subW,pledges,rec,recSkip,footer},updated_at:new Date().toISOString()});if(error)toast('تعذر الحفظ: '+error.message)}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:84px;right:50%;transform:translateX(50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const toRow=t=>({id:t.id,type:t.type,date:t.date,amt:t.amt,w:t.w||null,w2:t.w2||null,cat:t.cat||null,note:t.note||null,p:t.p||null,rcpt:t.rcpt||null,fund:t.fund||null,...(('img' in t)?{img:t.img}:{}),updated_at:new Date().toISOString()});
const fromRow=r=>({id:r.id,type:r.type,date:r.date,amt:Number(r.amt),w:r.w,w2:r.w2,cat:r.cat||'',note:r.note||'',p:r.p||'',rcpt:r.rcpt||'',fund:r.fund||'',hasimg:!!r.hasimg,ts:Date.parse(r.updated_at)||0});
async function upsertTx(t){const row=toRow(t);delete t.img;const {error}=await SB.from('tx').upsert(row);if(error){toast('تعذر الحفظ: '+error.message);return false}return true}
async function loadAll(){
 const [s,t]=await Promise.all([SB.from('settings').select('data').eq('id',1).maybeSingle(),SB.from('tx').select('id,type,date,amt,w,w2,cat,note,p,rcpt,fund,hasimg,updated_at').order('date',{ascending:false}).limit(20000)]);
 if(s.error||t.error){toast('تعذر تحميل البيانات');return}
 if(s.data&&s.data.data)D=Object.assign(JSON.parse(JSON.stringify(DEF)),s.data.data);else if(ROLE==='admin'){D=JSON.parse(JSON.stringify(DEF));await pushSettings()}
 D.tx=t.data.map(fromRow);
 if(!D.m2){D.m2=1;if(!D.wallets.some(w=>w.name.includes('فودافون')))D.wallets.push({id:'w3',name:'فودافون كاش',open:0});if(CANW())pushSettings()}
 if(!D.m1){D.m1=1;['in','out'].forEach(k=>{if(!D.cats[k].includes('اشتراكات'))D.cats[k].push('اشتراكات')});if(CANW())pushSettings()}
}
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' '+D.cur;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wname=id=>(D.wallets.find(w=>w.id===id)||{name:'—'}).name;
const pname=id=>(D.people.find(p=>p.id===id)||{name:''}).name;
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function home(){
 const m=today().slice(0,7);const mt=D.tx.filter(t=>t.date.startsWith(m));
 const total=D.wallets.reduce((a,w)=>a+walletBal(w),0);
 const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(lc(d).slice(0,7))}
 const data=months.map(x=>{const l=D.tx.filter(t=>t.date.startsWith(x));return[x,sum(l,'in'),sum(l,'out')]});
 const mx=Math.max(1,...data.flat().filter(v=>typeof v==='number'));
 const last=[...D.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).slice(0,6);
 $('#main').innerHTML=`<h2 style="display:flex;gap:10px;align-items:center">${LOGOH(D.logo)} ${esc(D.church)}</h2>${UNAME()?'<div style="color:#667;margin:-4px 0 8px">أهلاً '+esc(UNAME())+'</div>':''}
${alerts()}
 <div class="grid">
 <div class="card stat"><small>إجمالي الرصيد</small><b>${fmt(total)}</b></div>

 <div class="row wr" style="margin-top:14px"><button class="btn in2" onclick="openTx('in')">＋ إيراد</button><button class="btn out2" onclick="openTx('out')">－ مصروف</button><button class="btn g" onclick="openTx('tr')">⇄ تحويل</button></div>
 <div class="grid"><div class="card"><b>الحسابات</b><div style="margin-top:10px">${D.wallets.map(w=>`<div class="row" style="justify-content:space-between;margin:0;padding:8px 0;border-bottom:1px solid var(--bd)"><span>${esc(w.name)}</span><b>${fmt(walletBal(w))}</b></div>`).join('')}</div></div>
 <div class="card"><b>آخر ٦ شهور</b><div class="chart" style="margin-top:10px">${data.map(d=>`<div><span><i style="background:var(--ok);height:${d[1]/mx*100}%"></i><i style="background:var(--bad);height:${d[2]/mx*100}%"></i></span>${MN[+d[0].slice(5)-1].slice(0,4)}</div>`).join('')}</div><small style="color:var(--mu)">🟩 إيرادات &nbsp; 🟥 مصروفات</small></div></div>
 ${(D.funds||[]).length?`<div class="card" style="margin-top:12px"><b>الصناديق / الأغراض</b>${D.funds.map(f=>{const l=D.tx.filter(t=>t.fund===f);return `<div class="row" style="justify-content:space-between;margin:0;padding:8px 0;border-bottom:1px solid var(--bd)"><span>${esc(f)}</span><b>${fmt(sum(l,'in')-sum(l,'out'))}</b></div>`}).join('')}</div>`:''}
 <h3>آخر الحركات</h3>${txTable(last,false)}`;
}
function txTable(list,act=true){
 if(!list.length)return '<div class="card" style="text-align:center;color:var(--mu)">لا توجد حركات</div>';
 return `<div class="tw"><table><tr><th>التاريخ</th><th>البيان</th><th>التصنيف</th><th>الحساب</th><th>المبلغ</th>${act?'<th></th>':''}</tr>${list.map(t=>`<tr><td>${t.date}</td><td>${t.rcpt?'<small style="color:var(--mu)">#'+esc(t.rcpt)+'</small> ':''}${esc(t.note||'')}${t.fund?' <span class="tag">'+esc(t.fund)+'</span>':''}${t.hasimg?' <a href="#" onclick="viewImg(\''+t.id+'\');return false">📎</a>':''}${t.p?' <span class="tag">'+esc(pname(t.p))+'</span>':''}</td><td>${t.type==='tr'?'تحويل':esc(t.cat)}</td><td>${esc(wname(t.w))}${t.type==='tr'?' ← '+esc(wname(t.w2)):''}</td><td class="${t.type==='in'?'in':t.type==='out'?'out':''}"><b>${t.type==='out'?'-':t.type==='in'?'+':''}${fmt(t.amt)}</b></td>${act?`<td style="white-space:nowrap">${t.type==='in'?`<button class="btn g s" onclick="showReceipt('${t.id}')">🧾 إيصال</button> `:''}<span class="wr"><button class="btn g s" onclick="openTx(null,'${t.id}')">تعديل</button> <button class="btn g s" onclick="delTx('${t.id}')">حذف</button></span></td>`:''}</tr>`).join('')}</table></div>`;

function filtered(){return D.tx.filter(t=>(!flt.m||t.date.startsWith(flt.m))&&(!flt.t||t.type===flt.t)&&(!flt.c||t.cat===flt.c)&&(!flt.q||((t.note||'')+pname(t.p)+(t.cat||'')).includes(flt.q))).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts)}
function tx(){
 const l=filtered();const allc=[...D.cats.in,...D.cats.out];

 <div><label>النوع</label><select onchange="flt.t=this.value;tx()"><option value="">الكل</option><option value="in" ${flt.t==='in'?'selected':''}>إيراد</option><option value="out" ${flt.t==='out'?'selected':''}>مصروف</option><option value="tr" ${flt.t==='tr'?'selected':''}>تحويل</option></select></div>

function openTx(type,id){
 window._imgSet=false;window._img=null;const t=id?D.tx.find(x=>x.id===id):{type,date:today(),w:D.wallets[0].id,w2:(D.wallets[1]||D.wallets[0]).id,cat:'',amt:'',note:'',p:''};

 <div><label>رقم الإيصال (اختياري)</label><input id="f_rcpt" value="${esc(t.rcpt||'')}"></div></div>

function swType(ty,id){if(id){const t=D.tx.find(x=>x.id===id);t.type=ty;t.cat=ty==='tr'?'':D.cats[ty][0]||'';}openTx(ty,id||null)}
async function saveTx(ty,id){
 const amt=parseFloat($('#f_amt').value);if(!(amt>0)){alert('اكتب مبلغ صحيح');return}
 const o={type:ty,date:$('#f_date').value||today(),amt,w:$('#f_w').value,note:$('#f_note').value.trim()};
 o.rcpt=$('#f_rcpt').value.trim();if(ty!=='tr')o.fund=$('#f_fund').value;if(window._imgSet){o.img=window._img;o.hasimg=!!window._img}
 if(ty==='tr'){o.w2=$('#f_w2').value;if(o.w===o.w2){alert('اختار حسابين مختلفين');return}}else{o.cat=$('#f_cat').value;o.p=$('#f_p').value}
 const oldD=id?D.tx.find(x=>x.id===id).date:null;if(isLocked(o.date)||(oldD&&isLocked(oldD))){alert('الشهر ده مقفول. افتحه من الإعدادات.');return}
 let row;if(id){row=D.tx.find(x=>x.id===id);Object.assign(row,o)}else{o.id=uid()+uid();o.ts=Date.now();D.tx.push(o);row=o}
 upsertTx(row).then(ok=>{if(!ok)refresh()});closeM();render();
}
function delTx(id){const t0=D.tx.find(x=>x.id===id);if(t0&&isLocked(t0.date)){alert('الشهر ده مقفول.');return}if(confirm('حذف الحركة؟')){if(id.startsWith('rec_')){D.recSkip=D.recSkip||[];D.recSkip.push(id);save()}D.tx=D.tx.filter(t=>t.id!==id);SB.from('tx').delete().eq('id',id).then(r=>{if(r.error)toast('تعذر الحذف')});render()}}

 <h3 style="margin:6px 0">${esc(D.church)} - كشف حساب ${flt.m?mlabel(flt.m):'كل الفترات'}</h3>
 <div class="grid"><div class="card stat"><small>إجمالي الإيرادات</small><b class="in">${fmt(ti)}</b></div><div class="card stat"><small>إجمالي المصروفات</small><b class="out">${fmt(to)}</b></div><div class="card stat"><small>الفائض / العجز</small><b>${fmt(ti-to)}</b></div></div>

const GS_SCRIPT="var SBURL = 'https://eeaalajfycetfjccfute.supabase.co';\nvar KEY = 'sb_publishable_CYTXG2LLcWkEbcj4rf7ECw_3ftETaOq';\n\nfunction syncAll() {\n  var p = PropertiesService.getScriptProperties();\n  var r = UrlFetchApp.fetch(SBURL + '/auth/v1/token?grant_type=password', {\n    method: 'post', contentType: 'application/json', headers: {apikey: KEY},\n    payload: JSON.stringify({email: p.getProperty('EMAIL'), password: p.getProperty('PASS')}),\n    muteHttpExceptions: true\n  });\n  var tok = JSON.parse(r.getContentText()).access_token;\n  if (!tok) throw new Error('فشل تسجيل الدخول: راجع EMAIL و PASS');\n  var H = {apikey: KEY, Authorization: 'Bearer ' + tok};\n  var get = function (path) { return JSON.parse(UrlFetchApp.fetch(SBURL + '/rest/v1/' + path, {headers: H}).getContentText()); };\n  var st = get('settings?select=data&id=eq.1')[0].data || {};\n  var tx = [], off = 0, b;\n  do {\n    b = get('tx?select=id,type,date,amt,w,w2,cat,note,p,rcpt,fund&order=date.desc&limit=1000&offset=' + off);\n    tx = tx.concat(b); off += 1000;\n  } while (b.length == 1000);\n  var W = {}, P = {};\n  (st.wallets || []).forEach(function (w) { W[w.id] = w.name; });\n  (st.people || []).forEach(function (q) { P[q.id] = q.name; });\n  var T = {in: 'إيراد', out: 'مصروف', tr: 'تحويل'};\n  var rows = [['التاريخ', 'النوع', 'التصنيف', 'الحساب', 'إلى حساب', 'المبلغ', 'الاسم', 'البيان', 'رقم الإيصال', 'الصندوق']];\n  tx.forEach(function (t) {\n    rows.push([t.date, T[t.type], t.cat || '', W[t.w] || '', t.w2 ? (W[t.w2] || '') : '', Number(t.amt), P[t.p] || '', t.note || '', t.rcpt || '', t.fund || '']);\n  });\n  write('المعاملات', rows);\n  var subs = [['الشهر', 'العضو', 'المبلغ', 'الحساب', 'التاريخ']];\n  tx.filter(function (t) { return String(t.id).indexOf('sub_') == 0; }).forEach(function (t) {\n    subs.push([String(t.id).substr(4, 7), P[t.p] || '', Number(t.amt), W[t.w] || '', t.date]);\n  });\n  write('الاشتراكات', subs);\n  var ppl = [['الاسم', 'التليفون']];\n  (st.people || []).forEach(function (q) { ppl.push([q.name, q.phone || '']); });\n  write('الأعضاء', ppl);\n  var bal = [['الحساب', 'الرصيد']];\n  (st.wallets || []).forEach(function (w) {\n    var v = Number(w.open) || 0;\n    tx.forEach(function (t) {\n      if (t.type == 'in' && t.w == w.id) v += Number(t.amt);\n      if (t.type == 'out' && t.w == w.id) v -= Number(t.amt);\n      if (t.type == 'tr') { if (t.w == w.id) v -= Number(t.amt); if (t.w2 == w.id) v += Number(t.amt); }\n    });\n    bal.push([w.name, v]);\n  });\n  write('الحسابات', bal);\n  write('آخر تحديث', [['آخر تحديث', new Date()]]);\n}\n\nfunction write(name, rows) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clearContents();\n  sh.getRange(1, 1, rows.length, rows[0].length).setValues(rows);\n}\n\nfunction setup() {\n  ScriptApp.newTrigger('syncAll').timeBased().everyHours(1).create();\n  syncAll();\n}\n";
function gsh(){$('#main').innerHTML='<div class="row noprint"><button class="btn g" onclick="go(\'set\')">رجوع</button></div><h2>📊 ربط التطبيق بجوجل شيت</h2><div class="card" style="line-height:2"><b>الفكرة:</b> شيت على حساب جوجل بتاعك بيسحب كل ساعة (تلقائي) المعاملات والأعضاء والاشتراكات والأرصدة من التطبيق. النقل في اتجاه واحد (من التطبيق للشيت)، يعني تعديل الشيت ما بيغيّرش التطبيق. البيانات مش عامة: الشيت بيدخل بحساب "مشاهدة فقط".<br><b>بنفس الإيميل:</b> التطبيق بيتفتح بنفس الرابط على الكمبيوتر والتليفون، وبتسجل بنفس الإيميل فتلاقي نفس البيانات متزامنة.</div><h3>الخطوات</h3><div class="card" style="line-height:2.2"><b>١.</b> اعمل حساب جديد في التطبيق (من شاشة الدخول: مستخدم جديد؟ إنشاء حساب) بإيميل مخصص للشيت (ممكن يكون مش حقيقي زي sheet@church.com) وكلمة مرور.<br><b>٢.</b> ارجع بحسابك المدير: الإعدادات > المستخدمون والصلاحيات، وغيّر صلاحية الحساب ده إلى <b>مشاهدة فقط</b>.<br><b>٣.</b> افتح <b>sheets.new</b> لعمل شيت جديد على حساب جوجل بتاعك.<br><b>٤.</b> من القائمة: <b>الإضافات (Extensions) > Apps Script</b>.<br><b>٥.</b> امسح أي كود موجود، والصق الكود اللي تحت (زرار نسخ)، واضغط حفظ.<br><b>٦.</b> من <b>إعدادات المشروع (Project Settings) > Script Properties</b> أضف خاصيتين: <b>EMAIL</b> = إيميل حساب المشاهدة، و <b>PASS</b> = كلمته.<br><b>٧.</b> اختار الدالة <b>setup</b> من فوق واضغط <b>Run</b>، ووافق على أذونات جوجل. هتتعمل تبويبات: المعاملات، الاشتراكات، الأعضاء، الحسابات، وبيتحدث كل ساعة.<br><small style="color:var(--mu)">تنبيه أمان: كلمة مرور حساب المشاهدة محفوظة في الشيت، فشارك الشيت مع ناس موثوقين بس. ولو اتسربت غيّر كلمة مرور الحساب أو احذفه من الإعدادات.</small></div><div class="row" style="margin-top:12px"><button class="btn" onclick="navigator.clipboard.writeText(GS_SCRIPT).then(()=>toast(\'تم النسخ\'))">📋 نسخ الكود</button></div><textarea readonly dir="ltr" style="width:100%;height:260px;font-family:monospace;font-size:12px" id="gscode"></textarea>';$('#gscode').value=GS_SCRIPT}

function showReceipt(id){const t=D.tx.find(x=>x.id===id);if(!t)return;
 const c=document.createElement('canvas');c.width=800;c.height=640;const g=c.getContext('2d');
 const done=lg=>{g.fillStyle='#fff';g.fillRect(0,0,800,640);g.strokeStyle='#1e3a5f';g.lineWidth=6;g.strokeRect(10,10,780,620);g.direction='rtl';g.textAlign='right';
  let x=770;if(lg){g.drawImage(lg,690,30,80,80);x=670}
  g.fillStyle='#1e3a5f';g.font='bold 36px Arial,sans-serif';g.fillText(D.church,x,85);
  g.textAlign='center';g.font='bold 30px Arial,sans-serif';g.fillStyle='#000';g.fillText('إيصال استلام',400,165);
  g.beginPath();g.moveTo(60,185);g.lineTo(740,185);g.strokeStyle='#ccc';g.lineWidth=2;g.stroke();
  g.textAlign='right';g.font='26px Arial,sans-serif';
  const rows=[['رقم الإيصال',t.rcpt||('#'+t.id.slice(-5))],['التاريخ',t.date],['استلمنا من',t.p?pname(t.p):'—'],['مبلغ وقدره',fmt(t.amt)],['البند',t.cat||'—'],['طريقة الدفع / الحساب',wname(t.w)]];if(t.note)rows.push(['البيان',t.note]);
  rows.forEach((r,i)=>{g.fillStyle='#667';g.fillText(r[0]+':',760,235+i*52);g.fillStyle='#000';g.fillText(String(r[1]),520,235+i*52)});
  g.fillStyle='#667';g.fillText('توقيع أمين الصندوق: ____________________',760,600);
  window._rc=c;$('#box').innerHTML='<img src="'+c.toDataURL('image/png')+'" style="width:100%;border-radius:8px;border:1px solid var(--bd)"><div class="row" style="margin-top:12px"><button class="btn" onclick="shareReceipt()">📤 مشاركة (واتساب)</button><button class="btn g" onclick="dlReceipt()">⬇ حفظ صورة</button><button class="btn g" onclick="closeM()">إغلاق</button></div>';$('#modal').classList.add('on')};
 if(D.logo){const im=new Image();im.onload=()=>done(im);im.onerror=()=>done(null);im.src=D.logo}else done(null)}

async function autoRecurring(){if(!CANW()||!(D.rec||[]).length)return;const t=today(),cm=t.slice(0,7);let n=0;

 ${['in','out'].map(k=>`<h3>تصنيفات ${k==='in'?'الإيرادات':'المصروفات'}</h3><div class="card"><div class="row">${D.cats[k].map((c,i)=>`<span class="tag">${esc(c)} <a href="#" onclick="cDel('${k}',${i});return false">✕</a></span>`).join('')}</div><div class="row"><input id="nc_${k}" placeholder="تصنيف جديد" style="max-width:220px"><button class="btn g" onclick="cAdd('${k}')">إضافة</button></div></div>`).join('')}
 <h3>الصناديق / الأغراض</h3><div class="card"><div class="row">${(D.funds||[]).map((f,i)=>`<span class="tag">${esc(f)} <a href="#" onclick="fDel(${i});return false">✕</a></span>`).join('')||'<span style="color:var(--mu)">مفيش صناديق. أضف مثلًا: بناء، خدمة، رحلات</span>'}</div><div class="row"><input id="nf" placeholder="صندوق جديد" style="max-width:220px"><button class="btn g" onclick="fAdd()">إضافة</button></div></div>
 <h3>التنبيه وقفل الشهور</h3><div class="card"><div class="f"><div><label>اعتبر العضو متأخر بعد كام يوم من أول الشهر</label><input type="number" min="0" list="gr" value="${D.subGrace==null?7:D.subGrace}" onchange="D.subGrace=+this.value;save()"><datalist id="gr"><option value="3"><option value="7"><option value="15"><option value="30"></datalist></div><div><label>نبّهني لو رصيد الخزنة أقل من</label><input type="number" value="${D.lowCash||''}" onchange="D.lowCash=+this.value;save()"></div>${ROLE==='admin'?`<div><label>قفل كل الشهور حتى (شامل)</label><input type="month" value="${D.lockedUntil||''}" onchange="setLock(this.value)"></div>`:''}</div><div class="row" style="margin-top:10px">${notifOn()?'<span>🔔 إشعارات التليفون مفعّلة على الجهاز ده</span><button class="btn g s" onclick="disableNotif()">إيقاف</button>':'<button class="btn g" onclick="enableNotif()">🔔 تفعيل إشعارات المتأخرين على الجهاز ده</button>'}</div><small style="color:var(--mu)">الإشعار بيظهر مرة في اليوم لما تفتح التطبيق. الشهر المقفول ما ينفعش إضافة أو تعديل أو مسح حركات فيه (حتى من السيرفر). المدير بس يفتحه.</small></div>
 <h3>الميزانية الشهرية للمصروفات</h3><div class="card"><div class="f">${D.cats.out.map(c=>`<div><label>${esc(c)}</label><input type="number" value="${D.budget[c]||''}" onchange="D.budget[${JSON.stringify(c).replace(/"/g,'&quot;')}]=+this.value;save()"></div>`).join('')}</div></div>
 ${ROLE==='admin'?'<h3>المستخدمون والصلاحيات</h3><div class="card" id="users">جاري التحميل...</div>':''}
 ${CANW()?'<div class="row"><button class="btn" onclick="go(\'rcr\')">🔁 مصروفات متكررة</button></div>':''}
 ${ROLE==='admin'?'<div class="row"><button class="btn" onclick="go(\'gsh\')">📊 ربط جوجل شيت (شرح)</button></div>':''}
 ${ROLE==='admin'?'<h3>سجل المراجعة (آخر ١٠٠ عملية)</h3><div class="card" id="audit">جاري التحميل...</div><h3>نسخ احتياطية تلقائية على السيرفر</h3><div class="card" id="bks">جاري التحميل...</div>':''}
 <h3>نسخة احتياطية</h3><div class="card"><p style="margin-top:0;color:var(--mu)">البيانات محفوظة أونلاين ومتزامنة بين كل الأجهزة. حمّل نسخة احتياطية من وقت للتاني. "استرجاع" بيضيف حركات من ملف نسخة قديمة.</p><div class="row"><button class="btn" onclick="backup()">⬇ تحميل نسخة</button><button class="btn g" onclick="$('#rf').click()">⬆ استرجاع نسخة</button><input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this.files[0])"></div></div>`;
}
async function loadUsers(){const el=$('#users');if(!el)return;const {data,error}=await SB.from('members').select('*').order('created_at');if(error){el.textContent='تعذر التحميل';return}el.innerHTML='<div class="tw"><table><tr><th>البريد</th><th>الصلاحية</th><th></th></tr>'+data.map(u=>`<tr><td dir="ltr" style="text-align:right">${esc(u.email)}</td><td><select onchange="setRole('${u.user_id}',this.value)" ${u.user_id===ME.id?'disabled':''}>${[['pending','في الانتظار'],['viewer','مشاهدة فقط'],['treasurer','أمين صندوق'],['admin','مدير']].map(r=>`<option value="${r[0]}" ${u.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></td><td>${u.user_id===ME.id?'':`<button class="btn g s" onclick="rmUser('${u.user_id}')">حذف</button>`}</td></tr>`).join('')+'</table></div>'}
async function setRole(id,r){const {error}=await SB.from('members').update({role:r}).eq('user_id',id);toast(error?'تعذر التعديل':'تم')}
async function rmUser(id){if(confirm('إزالة المستخدم من النظام؟')){await SB.from('members').delete().eq('user_id',id);loadUsers()}}
function saveS(){D.church=$('#s_ch').value||'الكنيسة';D.cur=$('#s_cur').value||'ج.م';D.footer=$('#s_ft').value.trim();save();cacheBrand();render()}
function wUp(id,k,v){D.wallets.find(w=>w.id===id)[k]=v;save()}
function wDel(id){if(D.tx.some(t=>t.w===id||t.w2===id)){alert('الحساب عليه حركات ولا يمكن حذفه');return}D.wallets=D.wallets.filter(w=>w.id!==id);save();set()}
function cAdd(k){const v=$('#nc_'+k).value.trim();if(v&&!D.cats[k].includes(v)){D.cats[k].push(v);save();set()}}
function cDel(k,i){D.cats[k].splice(i,1);save();set()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backup(){dl('church-backup-'+today()+'.json',JSON.stringify(D),'application/json')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o.tx||!o.wallets)throw 0;if(!confirm('هيتم دمج الإعدادات والحركات من الملف مع البيانات الحالية. متأكد؟'))return;const keep=D.tx;D=Object.assign(JSON.parse(JSON.stringify(DEF)),o,{tx:keep});await pushSettings();const rows=o.tx.map(t=>toRow(Object.assign({},t,{id:t.id||uid()+uid()})));for(let i=0;i<rows.length;i+=200){const {error}=await SB.from('tx').upsert(rows.slice(i,i+200));if(error){toast('تعذر الاستيراد: '+error.message);break}}await refresh();toast('تم الاسترجاع')}catch(e){alert('ملف غير صالح')}};r.readAsText(f)}
function csv(l){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const rows=[['التاريخ','النوع','التصنيف','الحساب','إلى','المبلغ','الاسم','البيان','رقم الإيصال','الصندوق']].concat(l.map(t=>[t.date,{in:'إيراد',out:'مصروف',tr:'تحويل'}[t.type],t.cat||'',wname(t.w),t.type==='tr'?wname(t.w2):'',t.amt,pname(t.p),t.note||'',t.rcpt||'',t.fund||'']));dl('church-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}

function swAuth(){authMode=authMode==='in'?'up':'in';$('#lgo').textContent=authMode==='in'?'دخول':'إنشاء حساب';$('#un').style.display=authMode==='in'?'none':'';$('#lsw').textContent=authMode==='in'?'مستخدم جديد؟ إنشاء حساب':'عندي حساب؟ دخول';$('#lmsg').textContent=''}
async function doAuth(){const email=$('#em').value.trim(),pw=$('#pw').value;if(!email||pw.length<6){$('#lmsg').textContent='اكتب البريد وكلمة مرور (6 حروف على الأقل)';return}
 $('#lgo').disabled=true;$('#lmsg').textContent='...';
 let r=authMode==='in'?await SB.auth.signInWithPassword({email,password:pw}):await SB.auth.signUp({email,password:pw,options:{data:{name:$('#un').value.trim()}}});
 $('#lgo').disabled=false;
 if(r.error){$('#lmsg').textContent=({'Invalid login credentials':'البريد أو كلمة المرور غير صحيحة','User already registered':'الحساب موجود، سجّل دخول'}[r.error.message]||r.error.message);return}
 if(!r.data.session){$('#lmsg').textContent='تم إنشاء الحساب. سجّل دخول.';authMode='up';swAuth();return}
 boot()}
async function logout(){await SB.auth.signOut();location.reload()}
async function getRole(){const {data}=await SB.from('members').select('role').eq('user_id',ME.id).maybeSingle();return data?data.role:'none'}
async function boot(){
 const {data}=await SB.auth.getSession();
 if(!data.session){loginBrand();$('#lock').style.display='flex';return}
 ME=data.session.user;ROLE=await getRole();
 if(ROLE==='pending'||ROLE==='none'){$('#lock').style.display='flex';$('#lform').innerHTML='<div style="color:#fff;line-height:1.8">تم تسجيل حسابك ('+esc(ME.email)+').<br>في انتظار موافقة مدير النظام.</div><button class="btn lbtn" onclick="boot()">تحديث</button><a href="#" onclick="logout();return false">خروج</a>';return}
 $('#lock').style.display='none';document.body.classList.toggle('ro',!CANW());
 await loadAll();await autoRecurring();cacheBrand();render();autoBackup();notifyLate();
}
async function refresh(){if(!ME||!CANW()&&ROLE!=='viewer')return;if($('#modal').classList.contains('on'))return;const ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&ae.id!=='')return;await loadAll();render()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
